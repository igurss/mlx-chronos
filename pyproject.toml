[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-chronos"
version = "0.4.1"
description = "Benchmark suite and community leaderboard for local LLM inference on Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Igor Pastore", email = "182094468+igurss@users.noreply.github.com" },
]
keywords = [
    "apple-silicon",
    "benchmark",
    "inference",
    "llm",
    "mlx",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.24.0",
    "psutil>=5.9.0",
    "pydantic>=2.0",
    "questionary>=2.0.1",
    "rich>=13.0.0",
]

[project.optional-dependencies]
thermal = [
    "pyobjc-framework-Cocoa>=9.0",
]
test = [
    "mypy>=1.11",
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "ruff>=0.11",
    "types-psutil>=5.9",
]

[project.scripts]
mlx-chronos = "mlx_chronos.cli:main"

[project.urls]
Homepage = "https://igurss.github.io/mlx-chronos"
Repository = "https://github.com/igurss/mlx-chronos"
Issues = "https://github.com/igurss/mlx-chronos/issues"
Changelog = "https://github.com/igurss/mlx-chronos/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["mlx_chronos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
files = ["mlx_chronos"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["mlx_chronos"]

[tool.coverage.report]
fail_under = 78
show_missing = true
