name: Tests

on:
  pull_request:
    paths:
      - '.github/workflows/tests.yml'
      - '.github/workflows/release.yml'
      - 'mlx_chronos/**'
      - 'tests/**'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/tests.yml'
      - '.github/workflows/release.yml'
      - 'mlx_chronos/**'
      - 'tests/**'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  pytest:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[test]"

      - name: Show runner
        run: |
          sw_vers
          uname -m

      - name: Run CLI smoke checks
        run: |
          python -m mlx_chronos.cli --help
          python -m mlx_chronos.cli engines
          python -m mlx_chronos.detect

      - name: Run tests
        run: pytest
