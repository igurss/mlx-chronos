name: Tests

on:
  pull_request:
    paths:
      - '.github/workflows/*.yml'
      - 'docs/index.html'
      - 'docs/results_index.json'
      - 'mlx_chronos/**'
      - 'results/submitted/*.json'
      - 'results/submitted/**/*.json'
      - 'tests/**'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - 'docs/index.html'
      - 'docs/results_index.json'
      - 'mlx_chronos/**'
      - 'results/submitted/*.json'
      - 'results/submitted/**/*.json'
      - 'tests/**'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  pytest:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[test]"

      - name: Show runner
        run: |
          sw_vers
          uname -m

      - name: Run CLI smoke checks
        run: |
          python -m mlx_chronos.cli --help
          python -m mlx_chronos.cli --version
          python -m mlx_chronos.cli engines
          python -m mlx_chronos.detect

      - name: Validate leaderboard JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('docs/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)]
            .map(match => match[1]);
          for (const script of scripts) new Function(script);
          NODE

      - name: Run tests
        run: pytest
