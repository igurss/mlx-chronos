name: Tests

on:
  pull_request:
    paths:
      - '.github/workflows/tests.yml'
      - 'mlx_chronos/**'
      - 'tests/**'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/tests.yml'
      - 'mlx_chronos/**'
      - 'tests/**'
      - 'pyproject.toml'

jobs:
  pytest:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: pip install -e ".[test]"

      - name: Show runner
        run: |
          sw_vers
          uname -m

      - name: Run CLI smoke checks
        run: |
          python -m mlx_chronos.cli --help
          python -m mlx_chronos.cli engines
          python -m mlx_chronos.detect

      - name: Run tests
        run: pytest
