name: Tests

on:
  pull_request:
    paths:
      - '.github/workflows/tests.yml'
      - 'mlx_chronos/**'
      - 'tests/**'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/tests.yml'
      - 'mlx_chronos/**'
      - 'tests/**'
      - 'pyproject.toml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest
