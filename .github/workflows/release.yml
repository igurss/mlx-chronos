name: Release

on:
  # Manual runs validate the release pipeline without publishing to PyPI.
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Test on macOS
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Show runner
        run: |
          sw_vers
          uname -m

      - name: Run CLI smoke checks
        run: |
          python -m mlx_chronos.cli --help
          python -m mlx_chronos.cli --version
          python -m mlx_chronos.cli validate --help
          python -m mlx_chronos.cli models --help
          python -m mlx_chronos.cli engines
          python -c "from mlx_chronos.detect import detect_hardware; print(detect_hardware())"

      - name: Validate leaderboard JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('docs/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)]
            .map(match => match[1]);
          for (const script of scripts) new Function(script);
          NODE

      - name: Run frontend behavior and security tests
        run: node --test tests/frontend.test.cjs

      - name: Run tests
        run: pytest

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Lint
        run: ruff check mlx_chronos tests

      - name: Type check
        run: mypy

      - name: Enforce coverage
        run: pytest --cov --cov-report=term-missing

      - name: Verify generated leaderboard index is current
        run: python -m mlx_chronos.leaderboard --check

  build:
    name: Build distributions
    needs: [test, quality]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Verify tag matches project version
        if: github.event_name == 'push'
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())
          version = project["project"]["version"]
          expected_tag = f"v{version}"
          actual_tag = os.environ["GITHUB_REF_NAME"]
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"release tag {actual_tag!r} does not match pyproject version {version!r}"
              )
          PY

      - name: Build source and wheel distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  install:
    name: Install ${{ matrix.distribution }} on Python ${{ matrix.python-version }}
    needs: build
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
        distribution: [wheel, sdist]
    env:
      MLX_CHRONOS_DISABLE_UPDATE_CHECK: '1'
    steps:
      # Deliberately no checkout: imports must come from the installed package.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Install distribution in a fresh environment
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          python -m venv installed
          installed/bin/python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys

          wheel = os.environ['DISTRIBUTION'] == 'wheel'
          paths = list(Path('dist').glob('*.whl' if wheel else '*.tar.gz'))
          if len(paths) != 1:
              raise SystemExit(f'Expected one distribution, found {paths}')
          requirement = str(paths[0].resolve()) + ('[thermal]' if wheel else '')
          subprocess.run([sys.executable, '-m', 'pip', 'install', requirement], check=True)
          PY

      - name: Verify installed package and CLI
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          installed/bin/python -m pip check
          installed/bin/python - <<'PY'
          from importlib.metadata import version
          import os
          from pathlib import Path
          import mlx_chronos

          origin = Path(mlx_chronos.__file__).resolve()
          assert Path('installed').resolve() in origin.parents, origin
          assert mlx_chronos.__version__ == version('mlx-chronos')
          if os.environ['DISTRIBUTION'] == 'wheel':
              import Foundation
          print(f'Installed {mlx_chronos.__version__} from {origin}')
          PY
          installed/bin/mlx-chronos --version
          installed/bin/mlx-chronos --help
          for command in run matrix energy context concurrency compare history doctor engines models validate submit upgrade wizard; do
            installed/bin/mlx-chronos "$command" --help > /dev/null
          done

  publish:
    name: Publish to PyPI
    needs: install
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mlx-chronos
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
