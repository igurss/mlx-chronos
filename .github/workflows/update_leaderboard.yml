name: Update Leaderboard

on:
  push:
    branches: [main]
    paths:
      - 'results/submitted/*.json'
      - 'results/submitted/**/*.json'

permissions:
  contents: write

concurrency:
  group: update-leaderboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate and publish results index
        run: bash .github/scripts/update_leaderboard_index.sh
