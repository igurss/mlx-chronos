name: Update Leaderboard

on:
  push:
    branches: [main]
    paths:
      - 'results/submitted/*.json'
      - 'results/submitted/**/*.json'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package and dependencies
        run: pip install .

      - name: Generate results index
        run: |
          python - <<'EOF'
          import json
          import sys
          from pathlib import Path
          from pydantic import ValidationError

          from mlx_chronos.constants import TOKEN_COUNT_SOURCE_USAGE
          from mlx_chronos.schema import BenchmarkResult

          results_dir = Path("results/submitted")
          index = []
          errors = []

          for path in sorted(results_dir.rglob("*.json")):
              try:
                  data = json.loads(path.read_text())
                  result = BenchmarkResult(**data)
                  if result.metrics.token_count_source != TOKEN_COUNT_SOURCE_USAGE:
                      raise ValueError(
                          "leaderboard results must use usage.completion_tokens "
                          "for throughput token counts"
                      )

                  data = result.model_dump(mode="json")
                  hw = data["hardware"]
                  eng = data["engine"]
                  mod = data["model"]
                  met = data["metrics"]
                  tri = data["trials"]
                  meta = data["meta"]

                  index.append({
                      "chip": hw["chip"],
                      "memory_gb": hw["memory_gb"],
                      "machine_model": hw.get("machine_model", "unknown"),
                      "engine": eng["name"],
                      "engine_version": eng["version"],
                      "model": mod["name"],
                      "quantization": mod["quantization"],
                      "tps": met["tokens_per_second"]["mean"],
                      "tps_stddev": met["tokens_per_second"]["stddev"],
                      "ttft_cold": met["ttft_cold"]["mean"],
                      "ttft_cached": met["ttft_cached"]["mean"],
                      "ram_peak_gb": met["ram_peak_gb"],
                      "ram_is_process_rss": met.get("ram_is_process_rss", False),
                      "ram_measurement_method": met["ram_measurement_method"],
                      "system_ram_peak_gb": met["system_ram_peak_gb"],
                      "system_ram_peak_percent": met["system_ram_peak_percent"],
                      "token_count_source": met["token_count_source"],
                      "thermal_state": hw.get("thermal_state", "unavailable_no_sudo"),
                      "architecture": hw.get("architecture", "unknown"),
                      "trials": tri["count"],
                      "chronos_version": meta["chronos_version"],
                      "date": meta["timestamp"][:10],
                      "notes": meta.get("notes"),
                  })
              except ValidationError as e:
                  errors.append(f"{path.name}: {e}")
              except Exception as e:
                  errors.append(f"{path.name}: {e}")

          if errors:
              print("Invalid submitted result file(s):")
              for error in errors:
                  print(f"- {error}")
              sys.exit(1)

          out = Path("docs/results_index.json")
          out.write_text(json.dumps(index, indent=2))
          print(f"Generated index with {len(index)} results.")
          EOF

      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/results_index.json
          git diff --staged --quiet || git commit -m "chore: update leaderboard index [skip ci]"
          git push
