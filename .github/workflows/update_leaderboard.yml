name: Update Leaderboard

on:
  push:
    branches: [main]
    paths:
      - 'results/submitted/*.json'
      - 'results/submitted/**/*.json'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package and dependencies
        run: pip install .

      - name: Generate results index
        run: |
          python - <<'EOF'
          import json
          import sys
          from pathlib import Path

          from mlx_chronos.constants import SUSTAINED_THROUGHPUT_MAX_TOKENS
          from mlx_chronos.protocol import DEFAULT_THROUGHPUT_MAX_TOKENS
          from mlx_chronos.submit import SubmissionError, load_publishable_result

          results_dir = Path("results/submitted")
          index = []
          errors = []

          for path in sorted(results_dir.rglob("*.json")):
              try:
                  _, result = load_publishable_result(path)

                  data = result.model_dump(mode="json", by_alias=True)
                  hw = data["hardware"]
                  eng = data["engine"]
                  mod = data["model"]
                  met = data["metrics"]
                  tri = data["trials"]
                  meta = data["meta"]
                  integrity = data["integrity"]
                  decode_stats = met.get("decode_tokens_per_second") or {}
                  protocol = meta["benchmark_protocol"]
                  throughput_protocol = protocol["throughput"]
                  benchmark_profile = meta["benchmark_profile"]
                  throughput_max_tokens = throughput_protocol["requested_max_tokens"]
                  throughput_min_tokens = throughput_protocol.get("requested_min_tokens")
                  completion_tokens_raw = tri["completion_tokens_raw"]
                  completion_tokens_mean = (
                      round(sum(completion_tokens_raw) / len(completion_tokens_raw), 1)
                      if completion_tokens_raw
                      else None
                  )

                  index.append({
                      "chip": hw["chip"],
                      "memory_gb": hw["memory_gb"],
                      "machine_model": hw.get("machine_model", "unknown"),
                      "engine": eng["name"],
                      "engine_version": eng["version"],
                      "model": mod["name"],
                      "quantization": mod["quantization"],
                      "benchmark_profile": benchmark_profile,
                      "tps": met["tokens_per_second"]["mean"],
                      "tps_stddev": met["tokens_per_second"]["stddev"],
                      "decode_tps": decode_stats.get("mean"),
                      "decode_tps_stddev": decode_stats.get("stddev"),
                      "decode_timing_source": met.get(
                          "decode_timing_source",
                          "unavailable",
                      ),
                      "completion_tokens_raw": completion_tokens_raw,
                      "completion_tokens_mean": completion_tokens_mean,
                      "throughput_max_tokens": throughput_max_tokens,
                      "throughput_min_tokens": throughput_min_tokens,
                      "is_standard_throughput_tokens": (
                          (
                              benchmark_profile == "baseline"
                              and throughput_max_tokens == DEFAULT_THROUGHPUT_MAX_TOKENS
                              and throughput_min_tokens is None
                          )
                          or (
                              benchmark_profile == "sustained"
                              and throughput_max_tokens == SUSTAINED_THROUGHPUT_MAX_TOKENS
                              and throughput_min_tokens is None
                          )
                      ),
                      "ttft_cold": met["ttft_cold"]["mean"],
                      "ttft_cached": met["ttft_cached"]["mean"],
                      "ram_peak_gb": met["ram_peak_gb"],
                      "ram_is_process_rss": met.get("ram_is_process_rss", False),
                      "ram_measurement_method": met["ram_measurement_method"],
                      "system_ram_peak_gb": met["system_ram_peak_gb"],
                      "system_ram_peak_percent": met["system_ram_peak_percent"],
                      "token_count_source": met["token_count_source"],
                      "protocol_version": protocol["version"],
                      "integrity": "sealed",
                      "integrity_schema": integrity["schema"],
                      "thermal_state": hw["thermal_state"],
                      "power_source": hw.get("power_source"),
                      "low_power_mode": hw.get("low_power_mode"),
                      "architecture": hw["architecture"],
                      "trials": tri["count"],
                      "warmup_failures": meta["warmup_failures"],
                      "chronos_version": meta["chronos_version"],
                      "date": meta["timestamp"][:10],
                      "notes": meta.get("notes"),
                  })
              except SubmissionError as e:
                  errors.append(f"{path.name}: {e}")
              except Exception as e:
                  errors.append(f"{path.name}: {e}")

          if errors:
              print("Invalid submitted result file(s):")
              for error in errors:
                  print(f"- {error}")
              sys.exit(1)

          payload = {
              "metadata": {
                  "standard_throughput_max_tokens": (
                      DEFAULT_THROUGHPUT_MAX_TOKENS
                  ),
                  "standard_sustained_max_tokens": (
                      SUSTAINED_THROUGHPUT_MAX_TOKENS
                  ),
              },
              "results": index,
          }

          out = Path("docs/results_index.json")
          out.write_text(json.dumps(payload, indent=2) + "\n")
          print(f"Generated index with {len(index)} results.")
          EOF

      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/results_index.json
          git diff --staged --quiet || git commit -m "chore: update leaderboard index [skip ci]"
          git push
