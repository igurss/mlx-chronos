name: Update Leaderboard

on:
  push:
    branches: [main]
    paths:
      - 'results/submitted/*.json'
      - 'results/submitted/**/*.json'

permissions:
  contents: write
  pages: write

concurrency:
  group: update-leaderboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Regenerate and publish results index
        run: bash .github/scripts/update_leaderboard_index.sh

      # A push made with GITHUB_TOKEN does not itself trigger a Pages build.
      # This repository publishes main/docs with the legacy branch source.
      - name: Request Pages build for the latest main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
