name: Validate Benchmark Result

on:
  pull_request:
    paths:
      - 'results/submitted/*.json'
      - 'results/submitted/**/*.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch history to enable git diff

      # Runs before the pull request's own code is installed or executed.
      # `pip install .` runs the pull request's build backend, so a pull request
      # that also edited pyproject.toml would otherwise execute arbitrary code
      # before we ever checked that it only touched result JSON.
      - name: Check pull request scope
        id: scope
        env:
          TARGET_BRANCH: origin/${{ github.base_ref }}
        run: |
          set -euo pipefail

          git diff --name-only "$TARGET_BRANCH" HEAD > changed_files.txt

          unexpected=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              results/submitted/*.json) ;;
              *)
                if [ "$unexpected" -eq 0 ]; then
                  echo "Benchmark result submission PRs must only change JSON files under results/submitted/:"
                fi
                echo "- $path"
                unexpected=1
                ;;
            esac
          done < changed_files.txt
          [ "$unexpected" -eq 0 ] || exit 1

          missing=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if [ ! -f "$path" ]; then
              if [ "$missing" -eq 0 ]; then
                echo "Benchmark result submission PRs must not delete submitted result files:"
              fi
              echo "- $path"
              missing=1
            fi
          done < changed_files.txt
          [ "$missing" -eq 0 ] || exit 1

          count=$(grep -c . changed_files.txt || true)
          echo "changed_count=${count}" >> "$GITHUB_OUTPUT"
          echo "Scope check passed for ${count} changed file(s)."

      - name: Set up Python
        if: steps.scope.outputs.changed_count != '0'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install package and dependencies
        if: steps.scope.outputs.changed_count != '0'
        run: pip install . # Install Pydantic and other project dependencies

      - name: Validate submitted results
        if: steps.scope.outputs.changed_count != '0'
        run: |
          python - <<'EOF'
          import sys
          from pathlib import Path
          from mlx_chronos.leaderboard import load_archive_results
          from mlx_chronos.submit import load_publishable_result

          # Written by the scope check step, which already verified that every
          # entry is an existing JSON file under results/submitted/.
          json_files = [
              Path(line.strip())
              for line in Path("changed_files.txt").read_text().splitlines()
              if line.strip()
          ]

          if not json_files:
              print("No changed JSON files to validate.")
              sys.exit(0)

          errors = []
          print(f"Validating {len(json_files)} changed file(s)...\n")

          for path in json_files:
              try:
                  load_publishable_result(path)

                  print(f"OK: {path.name}")
              except Exception as e:
                  print(f"FAIL: {path.name} - {e}")
                  errors.append(path.name)

          if errors:
              print(f"\nValidation failed for {len(errors)} file(s).")
              sys.exit(1)

          try:
              load_archive_results(Path("results/submitted"))
          except Exception as e:
              print(f"FAIL: submitted result archive - {e}")
              sys.exit(1)

          print(f"\nAll {len(json_files)} changed file(s) are valid and unique.")
          EOF
