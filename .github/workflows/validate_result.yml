name: Validate Benchmark Result

on:
  pull_request:
    paths:
      - 'results/submitted/**.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Recupera la cronologia per permettere il git diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package and dependencies
        run: pip install . # Installa Pydantic e tutte le altre dipendenze del progetto

      - name: Validate submitted results
        env:
          TARGET_BRANCH: origin/${{ github.base_ref }}
        run: |
          python - <<'EOF'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          from pydantic import ValidationError

          from mlx_chronos.schema import BenchmarkResult

          def get_changed_json_files() -> list[Path]:
              target_branch = os.environ.get("TARGET_BRANCH", "origin/main")
              try:
                  result = subprocess.run(
                      [
                          "git",
                          "diff",
                          "--name-only",
                          target_branch,
                          "HEAD",
                          "--",
                          "results/submitted",
                      ],
                      capture_output=True,
                      text=True,
                      check=True,
                  )
                  files = [
                      Path(line.strip())
                      for line in result.stdout.splitlines()
                      if line.strip().endswith(".json")
                  ]
                  return [path for path in files if path.exists()]
              except Exception as e:
                  print(f"Warning: git diff failed ({e}), falling back to all files.")
                  return list(Path("results/submitted").glob("*.json"))

          json_files = get_changed_json_files()

          if not json_files:
              print("No changed JSON files to validate.")
              sys.exit(0)

          errors = []
          print(f"Validating {len(json_files)} changed file(s)...\n")

          for path in json_files:
              try:
                  data = json.loads(path.read_text())
                  BenchmarkResult(**data)

                  t = data["trials"]
                  if not (t["count"] == len(t["ttft_cold_raw"]) == len(t["ttft_cached_raw"]) == len(t["tokens_per_second_raw"])):
                      raise ValueError(
                          f"trials.count does not match raw data lengths in {path.name}"
                      )

                  print(f"OK: {path.name}")
              except ValidationError as e:
                  print(f"FAIL: {path.name}")
                  print(e)
                  errors.append(path.name)
              except Exception as e:
                  print(f"FAIL: {path.name} - {e}")
                  errors.append(path.name)

          if errors:
              print(f"\nValidation failed for {len(errors)} file(s).")
              sys.exit(1)
          else:
              print(f"\nAll {len(json_files)} changed file(s) are valid.")
          EOF
