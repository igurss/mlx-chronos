name: Validate Benchmark Result

on:
  pull_request:
    paths:
      - 'results/submitted/*.json'
      - 'results/submitted/**/*.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch history to enable git diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package and dependencies
        run: pip install . # Install Pydantic and other project dependencies

      - name: Validate submitted results
        env:
          TARGET_BRANCH: origin/${{ github.base_ref }}
        run: |
          python - <<'EOF'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          from pydantic import ValidationError

          from mlx_chronos.constants import TOKEN_COUNT_SOURCE_USAGE
          from mlx_chronos.schema import BenchmarkResult

          def get_changed_files() -> list[str]:
              target_branch = os.environ.get("TARGET_BRANCH", "origin/main")
              try:
                  result = subprocess.run(
                      [
                          "git",
                          "diff",
                          "--name-only",
                          target_branch,
                          "HEAD",
                          "--",
                          "results/submitted",
                      ],
                      capture_output=True,
                      text=True,
                      check=True,
                  )
                  return [
                      line.strip()
                      for line in result.stdout.splitlines()
                      if line.strip()
                  ]
              except Exception as e:
                  print(f"Warning: git diff failed ({e}), falling back to all files.")
                  return [
                      str(path)
                      for path in Path("results/submitted").rglob("*.json")
                  ]

          changed_files = get_changed_files()
          unexpected_files = [
              path
              for path in changed_files
              if not (
                  path.startswith("results/submitted/")
                  and path.endswith(".json")
              )
          ]
          if unexpected_files:
              print(
                  "Benchmark result submission PRs must only change JSON files "
                  "under results/submitted/:"
              )
              for path in unexpected_files:
                  print(f"- {path}")
              sys.exit(1)

          missing_json_files = [
              path
              for path in changed_files
              if path.endswith(".json") and not Path(path).exists()
          ]
          if missing_json_files:
              print(
                  "Benchmark result submission PRs must not delete submitted "
                  "result files:"
              )
              for path in missing_json_files:
                  print(f"- {path}")
              sys.exit(1)

          json_files = [
              Path(path)
              for path in changed_files
              if path.endswith(".json") and Path(path).exists()
          ]

          if not json_files:
              print("No changed JSON files to validate.")
              sys.exit(0)

          errors = []
          print(f"Validating {len(json_files)} changed file(s)...\n")

          for path in json_files:
              try:
                  data = json.loads(path.read_text())
                  result = BenchmarkResult(**data)
                  if result.metrics.token_count_source != TOKEN_COUNT_SOURCE_USAGE:
                      raise ValueError(
                          "submitted leaderboard results must use "
                          "usage.completion_tokens for throughput token counts"
                      )

                  print(f"OK: {path.name}")
              except ValidationError as e:
                  print(f"FAIL: {path.name}")
                  print(e)
                  errors.append(path.name)
              except Exception as e:
                  print(f"FAIL: {path.name} - {e}")
                  errors.append(path.name)

          if errors:
              print(f"\nValidation failed for {len(errors)} file(s).")
              sys.exit(1)
          else:
              print(f"\nAll {len(json_files)} changed file(s) are valid.")
          EOF
