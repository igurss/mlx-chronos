name: macOS App

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mlx-chronos-mac/**'
      - '.github/workflows/macos_app.yml'
      - 'LICENSE'
      - 'mlx_chronos/**'
      - 'pyproject.toml'
      - 'docs/app-runtime.json'
  push:
    branches: [main]
    paths:
      - 'apps/mlx-chronos-mac/**'
      - '.github/workflows/macos_app.yml'
      - 'LICENSE'
      - 'mlx_chronos/**'
      - 'pyproject.toml'
      - 'docs/app-runtime.json'

permissions:
  contents: read

jobs:
  regression:
    name: Bridge and Swift core regressions
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Prepare approved published CLI
        run: |
          python -m venv .venv-app
          python apps/mlx-chronos-mac/scripts/check_fresh_runtime.py --install-only "$PWD/.venv-app/bin/python"

      - name: Run reusable app regressions
        run: bash apps/mlx-chronos-mac/scripts/check.sh "$PWD/.venv-app/bin/python"

      - name: Verify current source CLI compatibility
        run: |
          python -m venv .venv-current
          .venv-current/bin/python -m pip install ".[thermal]"
          bash apps/mlx-chronos-mac/scripts/check.sh "$PWD/.venv-current/bin/python"

  build:
    name: Full macOS Release build
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and verify the complete app
        run: bash apps/mlx-chronos-mac/scripts/build_release.sh "$RUNNER_TEMP/chronos-app-build"

  bootstrap:
    name: Fresh private Python and CLI bootstrap
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Check standalone runtime without system Python
        run: bash apps/mlx-chronos-mac/scripts/check_bootstrap.sh
