name: macOS App

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mlx-chronos-mac/**'
      - '.github/workflows/macos_app.yml'
      - 'LICENSE'
  push:
    branches: [main]
    paths:
      - 'apps/mlx-chronos-mac/**'
      - '.github/workflows/macos_app.yml'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  regression:
    name: Bridge and Swift core regressions
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Prepare bundled CLI contract
        run: |
          python -m venv .venv-app
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          resources = Path('apps/mlx-chronos-mac/MLXChronos/Resources')
          manifest = json.loads((resources / 'runtime_manifest.json').read_text())
          wheel = resources / manifest['wheel']
          if hashlib.sha256(wheel.read_bytes()).hexdigest() != manifest['sha256']:
              raise SystemExit('Bundled wheel checksum mismatch')
          subprocess.run(['.venv-app/bin/python', '-m', 'pip', 'install',
                          str(wheel) + '[thermal]'], check=True)
          subprocess.run(['.venv-app/bin/python', '-m', 'pip', 'check'], check=True)
          PY

      - name: Run reusable app regressions
        run: bash apps/mlx-chronos-mac/scripts/check.sh "$PWD/.venv-app/bin/python"
